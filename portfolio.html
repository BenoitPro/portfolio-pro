<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Benoit Baillon — Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Benoit Baillon — Account Executive Banking & Finance chez OVHcloud le jour, builder IA le soir." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Spectral:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #FAFAF8;
    --bg-2: #F4F1E9;
    --bg-3: #EFEBE0;
    --ink: #0B1426;
    --ink-70: rgba(11, 20, 38, 0.70);
    --ink-55: rgba(11, 20, 38, 0.55);
    --ink-35: rgba(11, 20, 38, 0.35);
    --ink-20: rgba(11, 20, 38, 0.20);
    --line: rgba(11, 20, 38, 0.08);
    --line-2: rgba(11, 20, 38, 0.14);
    --accent: #0066FF;
    --accent-2: #0044C2;
    --accent-soft: rgba(0, 102, 255, 0.08);
    --accent-mid: rgba(0, 102, 255, 0.35);
    --glass: rgba(255, 255, 255, 0.55);
    --glass-stroke: rgba(255, 255, 255, 0.7);
    --shadow-sm: 0 1px 2px rgba(11, 20, 38, 0.04), 0 0 0 1px rgba(11, 20, 38, 0.04);
    --shadow-md: 0 4px 16px rgba(11, 20, 38, 0.06), 0 0 0 1px rgba(11, 20, 38, 0.05);
    --shadow-lg: 0 12px 48px rgba(11, 20, 38, 0.08), 0 0 0 1px rgba(11, 20, 38, 0.06);
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --r-xl: 28px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(to right, rgba(11, 20, 38, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(11, 20, 38, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    background-attachment: fixed;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
  }

  #app { position: relative; z-index: 2; }

  ::selection { background: var(--accent); color: white; }

  .italic {
    font-family: "Spectral", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.005em;
  }

  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78em;
    letter-spacing: 0.01em;
  }

  body::after {
    content: "";
    position: fixed;
    inset: -10vmax;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(38vmax 30vmax at 12% 8%, rgba(255, 255, 255, 0.85), transparent 60%),
      radial-gradient(34vmax 28vmax at 88% 18%, rgba(0, 102, 255, 0.055), transparent 65%),
      radial-gradient(42vmax 34vmax at 78% 62%, rgba(255, 247, 230, 0.9), transparent 62%),
      radial-gradient(30vmax 26vmax at 18% 78%, rgba(11, 20, 38, 0.035), transparent 65%),
      radial-gradient(36vmax 30vmax at 52% 110%, rgba(0, 102, 255, 0.04), transparent 60%);
    filter: blur(60px) saturate(1.1);
    mix-blend-mode: normal;
    opacity: 0.7;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.25;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04 0 0 0 0 0.08 0 0 0 0 0.15 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Topbar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px clamp(20px, 4vw, 56px);
    pointer-events: none;
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: padding 0.3s ease, background 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
  }
  .topbar > * { pointer-events: auto; }
  .topbar.scrolled {
    padding-top: 12px;
    padding-bottom: 12px;
    background: rgba(250, 250, 248, 0.72);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom-color: var(--line);
  }
  .topbar.scrolled .nav-links {
    background: transparent;
    border-color: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 600;
    letter-spacing: -0.015em;
    font-size: 15px;
    color: var(--ink);
    text-decoration: none;
    line-height: 1;
  }
  .brand .brand-mark {
    font-family: "Spectral", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    color: var(--ink-55);
    font-size: 13.5px;
    letter-spacing: 0;
  }
  .nav-links {
    display: inline-flex; gap: 22px; align-items: center;
    padding: 8px 14px;
    background: rgba(250,250,248,0.7);
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    border-radius: 999px;
    border: 1px solid rgba(11,20,38,0.05);
  }
  .nav-links a, .nav-links .nav-link-btn {
    color: var(--ink-70);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links .nav-link-btn:hover { color: var(--ink); }
  .nav-links .nav-link-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .nav-cmd {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 12px;
    border-radius: 8px;
    background: rgba(11,20,38,0.04);
    border: 1px solid var(--line);
    color: var(--ink-55);
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-cmd:hover { background: rgba(11,20,38,0.07); }
  .nav-cmd kbd {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    background: white;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  @media (max-width: 768px) {
    .nav-links { display: none; }
  }

  /* Hero */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .hero-meta {
    position: absolute;
    top: clamp(120px, 14vh, 180px);
    left: clamp(20px, 4vw, 56px);
    z-index: 10;
    max-width: 440px;
  }
  @media (min-width: 1100px) {
    .hero-meta { max-width: 540px; }
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 8px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-stroke);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-70);
    margin-bottom: 22px;
    box-shadow: var(--shadow-sm);
  }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
    100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }
  h1.hero-h1 {
    font-size: clamp(32px, 3.9vw, 56px);
    font-weight: 500;
    letter-spacing: -0.032em;
    line-height: 1.02;
    margin: 0 0 18px;
  }
  .hero-sub {
    font-size: clamp(14px, 1vw, 15.5px);
    color: var(--ink-55);
    max-width: 400px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .hero-cta-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* Hero rotator */
  .hero-rotator {
    position: absolute;
    right: clamp(20px, 4vw, 64px);
    bottom: clamp(48px, 10vh, 110px);
    z-index: 8;
    display: flex;
    align-items: baseline;
    gap: 14px;
    max-width: min(560px, 46vw);
    pointer-events: none;
  }
  .hr-frame {
    position: relative;
    flex: 0 0 auto;
    width: clamp(260px, 26vw, 360px);
    height: 1.6em;
    font-family: "Caveat", "Spectral", cursive;
    font-size: clamp(19px, 1.7vw, 23px);
    line-height: 1.35;
    overflow: hidden;
  }
  .hr-word {
    position: absolute;
    left: 0; top: 0;
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
    opacity: 0;
    animation: heroRotate 12s infinite;
  }
  .hr-word:nth-child(1) { animation-delay: 0s; }
  .hr-word:nth-child(2) { animation-delay: 4s; }
  .hr-word:nth-child(3) { animation-delay: 8s; }
  .hr-strike {
    font-size: 0.72em;
    color: var(--ink-35);
    text-decoration: line-through;
    text-decoration-thickness: 1.3px;
    text-decoration-color: var(--ink-35);
    font-weight: 500;
    transform: rotate(-1.2deg);
    transform-origin: left center;
  }
  .hr-keep { color: var(--ink); font-weight: 600; }
  .hr-keep .accent { color: var(--accent); }
  @keyframes heroRotate {
    0%, 1%    { opacity: 0; transform: translateY(8px); }
    4%, 30%   { opacity: 1; transform: translateY(0); }
    34%, 100% { opacity: 0; transform: translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hr-word { animation: none; opacity: 1; position: static; }
    .hr-frame { height: auto; }
    .hr-word + .hr-word { margin-top: 4px; }
  }
  @media (max-width: 900px) {
    .hero-rotator {
      position: static;
      max-width: 100%;
      margin: 18px clamp(20px, 4vw, 56px) 0;
      flex-wrap: wrap;
      gap: 10px 14px;
    }
    .hr-frame { width: 100%; flex-basis: 100%; }
  }

  /* Selfie */
  .hero-selfie {
    position: absolute;
    left: clamp(40px, 6vw, 100px);
    bottom: -80px;
    width: clamp(360px, 40vw, 660px);
    height: auto;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    filter:
      drop-shadow(-10px 14px 28px rgba(11, 20, 38, 0.12))
      drop-shadow(0 4px 10px rgba(11, 20, 38, 0.07));
    opacity: 0;
    --parallax-y: 0px;
    transform: translate3d(0, calc(14px + var(--parallax-y)), 0);
    animation: selfieIn 1.2s cubic-bezier(.2,.7,.2,1) 0.2s forwards;
    will-change: transform, opacity;
  }
  @keyframes selfieIn {
    to { opacity: 1; transform: translate3d(0, var(--parallax-y), 0); }
  }
  .hero-selfie.parallax-ready {
    opacity: 1;
    animation: none;
    transform: translate3d(0, var(--parallax-y), 0);
    transition: transform 0.05s linear;
  }

  /* Graph stage */
  .graph-stage {
    position: absolute;
    top: 0; bottom: 0;
    left: 38%; right: 0;
    z-index: 1;
    overflow: visible;
  }
  .graph-stage canvas { display: block; }

  .brain-label {
    position: absolute;
    transform: translate(-50%, calc(-100% - 16px));
    background: transparent;
    border: none;
    padding: 4px 6px;
    margin: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-70);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    will-change: transform, left, top, opacity;
    transition: color 0.2s, font-weight 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .brain-label::after {
    content: "";
    position: absolute;
    left: 50%; top: 100%;
    width: 1px; height: 14px;
    background: linear-gradient(to bottom, var(--ink-35), transparent);
    transform: translateX(-0.5px);
    pointer-events: none;
  }
  .brain-label-center { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .brain-label-hub, .brain-label-branch { font-weight: 600; color: var(--ink); }
  .brain-label.is-hover, .brain-label.is-active { color: var(--accent); }
  .brain-label.is-hover::after, .brain-label.is-active::after {
    background: linear-gradient(to bottom, var(--accent), rgba(0, 102, 255, 0));
  }
  .brain-label.is-back { font-weight: 400; }

  /* Concept nodes */
  .brain-label-concept {
    background: white;
    border: 2px solid var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .brain-label-concept.is-hover {
    background: var(--accent);
    color: white;
    box-shadow: 0 0 0 3px rgba(0,102,255,0.2), 0 0 0 6px rgba(0,102,255,0.08);
  }
  .brain-label-concept::after { display: none; }

  /* Concept Popup */
  .concept-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(11, 20, 38, 0.38);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: backdropIn 0.22s ease;
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .concept-popup {
    position: relative;
    width: 100%;
    max-width: 600px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: var(--r-xl);
    padding: 36px 40px 40px;
    box-shadow: 0 32px 80px rgba(11, 20, 38, 0.14), 0 0 0 1px rgba(11, 20, 38, 0.06);
    animation: popupIn 0.26s cubic-bezier(0.34, 1.46, 0.64, 1);
  }
  @keyframes popupIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .concept-popup-close {
    position: absolute;
    top: 18px; right: 18px;
    background: rgba(11, 20, 38, 0.06);
    border: none;
    border-radius: 50%;
    width: 32px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-55);
    font-size: 16px;
    transition: background 0.15s, color 0.15s;
    line-height: 1;
  }
  .concept-popup-close:hover { background: rgba(11, 20, 38, 0.12); color: var(--ink); }
  .concept-badge {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .concept-popup h2 {
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin: 0 0 12px;
    color: var(--ink);
  }
  .concept-caption {
    font-family: "Spectral", Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-55);
    margin: 0 0 18px;
  }
  .concept-body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-70);
    margin: 0 0 28px;
  }
  .concept-proofs-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-35);
    margin-bottom: 12px;
  }
  .concept-proofs {
    list-style: none;
    padding: 0; margin: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .concept-proofs li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--ink-70);
    line-height: 1.45;
  }
  .concept-proofs li::before {
    content: "";
    flex-shrink: 0;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 5px;
  }

  /* Claude Context Section */
  .claude-ctx {
    padding: clamp(64px, 8vw, 96px) clamp(20px, 4vw, 56px);
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .claude-ctx-card {
    width: 100%;
    max-width: 620px;
    background: rgba(255, 255, 255, 0.60);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: var(--r-xl);
    padding: clamp(32px, 4vw, 52px) clamp(28px, 4vw, 48px);
    box-shadow: var(--shadow-md);
  }
  .claude-ctx-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--accent-soft);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .claude-ctx h2 {
    font-size: clamp(24px, 2.8vw, 36px);
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1.1;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .claude-ctx-sub {
    font-size: clamp(14px, 1.1vw, 15.5px);
    color: var(--ink-55);
    line-height: 1.6;
    margin: 0 0 28px;
    max-width: 460px;
  }
  .claude-ctx-url-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(11, 20, 38, 0.04);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    padding: 10px 10px 10px 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .claude-ctx-url-icon {
    color: var(--ink-55);
    flex-shrink: 0;
  }
  .claude-ctx-url-text {
    flex: 1 1 auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    color: var(--ink-70);
    text-align: left;
    word-break: break-all;
  }
  .claude-ctx-copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: var(--r-sm);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .claude-ctx-copy-btn:hover { background: var(--accent); }
  .claude-ctx-copy-btn.copied { background: #16a34a; }
  .claude-ctx-legend {
    font-size: 11.5px;
    color: var(--ink-35);
    letter-spacing: 0.01em;
  }

  /* Hint */
  .hero-hint {
    position: absolute;
    bottom: 36px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: var(--ink-55);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .hero-hint-line {
    width: 1px; height: 36px;
    background: linear-gradient(to bottom, transparent, var(--ink-35));
    animation: hint 2.4s ease-in-out infinite;
  }
  @keyframes hint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Minimap */
  .minimap {
    position: fixed;
    top: 96px;
    left: clamp(20px, 4vw, 56px);
    z-index: 40;
    width: 240px; height: 240px;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border: 1px solid var(--glass-stroke);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-md);
    padding: 14px;
    opacity: 0;
    transform: translateY(-8px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease,
                width 0.35s cubic-bezier(.4,.0,.2,1),
                height 0.35s cubic-bezier(.4,.0,.2,1),
                padding 0.35s cubic-bezier(.4,.0,.2,1),
                border-radius 0.35s cubic-bezier(.4,.0,.2,1),
                background 0.3s ease;
    overflow: visible;
    will-change: width, height, opacity;
  }
  .minimap.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .minimap.collapsed {
    width: 116px; height: 30px;
    padding: 7px 12px;
    border-radius: 999px;
    opacity: 0.78;
    background: color-mix(in oklab, var(--glass) 80%, transparent);
    cursor: pointer;
    overflow: hidden;
  }
  .minimap.collapsed:hover { opacity: 1; }
  .minimap-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    transition: margin-bottom 0.25s ease;
  }
  .minimap.collapsed .minimap-head { margin-bottom: 0; gap: 8px; }
  .minimap-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-55);
    white-space: nowrap;
  }
  .minimap.collapsed .minimap-title::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.25); }
  }
  .minimap-current {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--accent);
    white-space: nowrap;
  }
  .minimap svg {
    width: 100%; height: calc(100% - 26px);
    transition: opacity 0.2s ease;
    overflow: visible;
  }
  .minimap.collapsed svg { opacity: 0; pointer-events: none; }
  .minimap .mini-edge { stroke: rgba(11,20,38,0.15); stroke-width: 0.7; fill: none; transition: stroke 0.2s ease, stroke-width 0.2s ease; }
  .minimap .mini-edge.hot { stroke: var(--accent); stroke-width: 1.2; }
  .minimap .mini-node-hit { fill: transparent; cursor: pointer; }
  .minimap .mini-node { fill: white; stroke: rgba(11,20,38,0.25); stroke-width: 1; transition: r 0.2s ease, fill 0.2s ease, stroke 0.2s ease, filter 0.2s ease; }
  .minimap .mini-node.center { fill: var(--ink); stroke: var(--ink); }
  .minimap .mini-node.active { fill: var(--accent); stroke: var(--accent); }
  .minimap .mini-node.hovered { filter: drop-shadow(0 0 5px rgba(0,102,255,0.5)); }
  .minimap .mini-label { font-family: "JetBrains Mono", monospace; font-size: 7.5px; fill: var(--ink-55); pointer-events: none; transition: opacity 0.2s ease; }
  .minimap .mini-label.active { fill: var(--accent); font-weight: 600; opacity: 1; }
  .minimap .mini-label.hidden { opacity: 0; }

  /* Node tooltip card */
  .minimap-tooltip {
    position: absolute;
    left: calc(100% + 10px);
    top: 30px;
    width: 200px;
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow-lg);
    padding: 10px 12px;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-6px) scale(0.97);
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 50;
  }
  .minimap-tooltip.show {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  .minimap-tooltip-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .minimap-tooltip-label .tt-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .minimap-tooltip-desc {
    font-size: 10.5px;
    color: var(--ink-55);
    line-height: 1.45;
    margin-bottom: 6px;
  }
  .minimap-tooltip-cta {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  @media (max-width: 900px) { .minimap { display: none; } }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
    position: relative;
  }
  .btn-primary { background: var(--ink); color: white; }
  .btn-primary:hover { background: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn .arrow { transition: transform 0.25s; display: inline-block; }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-cv { display: inline-flex; align-items: center; gap: 7px; }
  .btn-cv .cv-icon { transition: transform 0.25s; flex-shrink: 0; }
  .btn-cv:hover .cv-icon { transform: translateY(2px); }

  /* Section base */
  section { position: relative; z-index: 2; }
  section.sec { background-color: rgba(250, 250, 248, 0.55); }
  .container {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 clamp(20px, 4vw, 56px);
  }
  .sec {
    padding: clamp(80px, 12vh, 140px) 0;
    border-top: 1px solid var(--line);
  }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 24px;
    margin-bottom: 56px;
  }
  .sec-index {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--ink-35);
    letter-spacing: 0.04em;
    min-width: 44px;
  }
  .sec-title {
    font-size: clamp(32px, 3.6vw, 52px);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
    flex: 1;
  }
  .sec-kicker {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  /* Parcours grid */
  .why-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 48px;
    align-items: start;
  }
  .why-lead {
    font-size: clamp(22px, 2.2vw, 30px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 28px;
  }
  .why-lead .italic { color: var(--ink); }
  .why-body { color: var(--ink-70); font-size: 16px; max-width: 460px; }
  .why-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .why-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 22px 22px 24px;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .why-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-2); }
  .why-card-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.06em;
  }
  .why-card-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 10px 0 8px;
  }
  .why-card-body { font-size: 13.5px; color: var(--ink-55); line-height: 1.55; }
  @media (max-width: 900px) {
    .why-grid { grid-template-columns: 1fr; gap: 32px; }
    .why-cards { grid-template-columns: 1fr; }
  }

  /* Projects */
  .proj-list { display: flex; flex-direction: column; }
  .proj {
    display: grid;
    grid-template-columns: 60px 200px 1fr 1fr auto;
    gap: 28px;
    padding: 28px 0;
    border-top: 1px solid var(--line);
    align-items: center;
    transition: padding 0.3s, background 0.3s;
    position: relative;
    text-decoration: none;
    color: inherit;
  }
  .proj:first-child { border-top-color: var(--line-2); }
  .proj:hover { padding-left: 12px; padding-right: 12px; }
  .proj::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent-soft);
    opacity: 0;
    border-radius: var(--r-md);
    transition: opacity 0.3s;
    z-index: -1;
  }
  .proj:hover::before { opacity: 1; }
  .proj-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-35);
  }
  .proj-name {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .proj-name .italic { color: var(--accent); }
  .proj-tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-55);
    letter-spacing: 0.04em;
  }
  .proj-desc {
    color: var(--ink-70);
    font-size: 14.5px;
    max-width: 360px;
    line-height: 1.5;
  }
  .proj-stats { display: flex; gap: 18px; align-items: baseline; }
  .proj-stat { font-size: 13.5px; color: var(--ink-55); }
  .proj-stat b {
    font-weight: 600;
    color: var(--ink);
    font-size: 16px;
    margin-right: 4px;
  }
  .proj-arrow { color: var(--ink-35); transition: transform 0.3s, color 0.3s; }
  .proj:hover .proj-arrow { color: var(--accent); transform: translateX(4px); }
  @media (max-width: 1000px) {
    .proj { grid-template-columns: 40px 1fr auto; }
    .proj-tag, .proj-stats { display: none; }
    .proj-desc { grid-column: 2 / -1; }
  }

  /* Approach */
  .approach-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .step {
    padding: 32px 28px 36px;
    border-right: 1px solid var(--line);
    position: relative;
    transition: background 0.3s;
  }
  .step:last-child { border-right: none; }
  .step:hover { background: var(--bg-2); }
  .step-num {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 24px;
  }
  .step-title {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .step-body { color: var(--ink-55); font-size: 13.5px; line-height: 1.55; }
  .step-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
  .step-tags span {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    padding: 3px 7px;
    background: var(--bg-2);
    border-radius: 4px;
    color: var(--ink-70);
  }
  @media (max-width: 900px) {
    .approach-grid { grid-template-columns: 1fr 1fr; }
    .step:nth-child(2n) { border-right: none; }
    .step:not(:nth-last-child(-n+2)) { border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .approach-grid { grid-template-columns: 1fr; }
    .step { border-right: none; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: none; }
  }

  /* Stack chips */
  .stack-chips-row {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .stack-chips-row .stack-lead {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-55);
    margin-right: 12px;
  }
  .chip {
    padding: 6px 12px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 13px;
    color: var(--ink-70);
    transition: all 0.2s;
    cursor: default;
  }
  .chip:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }
  .chip.strong { background: var(--ink); color: white; border-color: var(--ink); }
  .chip.strong:hover { background: var(--accent); border-color: var(--accent); }

  /* Experience */
  .exp-list { display: flex; flex-direction: column; }
  .exp {
    display: grid;
    grid-template-columns: 160px 1fr 1fr;
    gap: 28px;
    padding: 26px 0;
    border-top: 1px solid var(--line);
    align-items: baseline;
  }
  .exp:first-child { border-top-color: var(--line-2); }
  .exp-date { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-55); letter-spacing: 0.04em; }
  .exp-role { font-size: 19px; font-weight: 500; letter-spacing: -0.015em; }
  .exp-co { color: var(--ink-55); font-size: 14px; margin-top: 4px; }
  .exp-body { color: var(--ink-70); font-size: 14px; line-height: 1.55; }
  @media (max-width: 720px) { .exp { grid-template-columns: 1fr; gap: 6px; } }

  /* Gallery */
  .gallery {
    position: relative;
    padding: clamp(80px, 11vh, 130px) 0;
    border-top: 1px solid var(--line);
    overflow: hidden;
  }
  .gallery-head {
    text-align: center;
    margin: 0 auto clamp(44px, 6vh, 72px);
    padding: 0 clamp(20px, 4vw, 56px);
  }
  .gallery-eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-55);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .gallery-eyebrow .num { color: var(--accent); }
  .gallery-h2 {
    font-size: clamp(32px, 4.4vw, 58px);
    font-weight: 500;
    letter-spacing: -0.028em;
    line-height: 1.04;
    max-width: 22ch;
    margin: 0 auto;
  }
  .gallery-sub {
    margin: 18px auto 0;
    color: var(--ink-55);
    font-size: 15px;
    max-width: 56ch;
    line-height: 1.55;
  }
  .marquee {
    position: relative;
    width: 100%;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
  }
  .marquee + .marquee { margin-top: 22px; }
  .marquee-track {
    display: flex;
    gap: 22px;
    width: max-content;
    padding: 6px 0;
    animation: marquee-left 72s linear infinite;
    will-change: transform;
  }
  .marquee.reverse .marquee-track {
    animation-name: marquee-right;
    animation-duration: 84s;
  }
  .marquee:hover .marquee-track,
  .marquee:focus-within .marquee-track { animation-play-state: paused; }
  @keyframes marquee-left {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }
  @keyframes marquee-right {
    from { transform: translate3d(-50%, 0, 0); }
    to   { transform: translate3d(0, 0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation: none; transform: translate3d(-12%, 0, 0); }
  }
  .gcard {
    flex: 0 0 auto;
    position: relative;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--bg-2);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
    transition: transform 0.4s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.4s ease;
  }
  .marquee:hover .gcard { opacity: 0.72; transition: opacity 0.3s ease; }
  .marquee .gcard:hover { opacity: 1; transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .gcard.size-a { width: 240px; height: 300px; }
  .gcard.size-b { width: 280px; height: 220px; }
  .gcard.size-c { width: 230px; height: 290px; }
  .gcard.size-d { width: 260px; height: 260px; }
  .gcard.size-e { width: 320px; height: 240px; }
  .gcard img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gcard-fallback {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(135deg,
        rgba(11, 20, 38, 0.05) 0 1px,
        transparent 1px 11px),
      linear-gradient(180deg, var(--c1, #efe9da) 0%, var(--c2, #d9d0bb) 100%);
  }
  .gcard-fallback::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(100% 80% at 50% 110%, rgba(11,20,38,0.18), transparent 60%);
    pointer-events: none;
  }
  .gcard-tag {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-70);
    background: rgba(250, 250, 248, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    letter-spacing: 0.04em;
  }
  .gcard-meta { display: none; }
  .gcard-caption { display: none; }
  @media (max-width: 720px) {
    .gcard.size-a { width: 180px; height: 230px; }
    .gcard.size-b { width: 210px; height: 170px; }
    .gcard.size-c { width: 175px; height: 220px; }
    .gcard.size-d { width: 200px; height: 200px; }
    .gcard.size-e { width: 240px; height: 180px; }
    .marquee + .marquee { margin-top: 16px; }
    .marquee-track { gap: 16px; }
  }

  /* Contact */
  .contact {
    text-align: center;
    padding: clamp(100px, 16vh, 180px) 0 clamp(80px, 12vh, 140px);
    border-top: 1px solid var(--line);
  }
  .contact-eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .contact-h2 {
    font-size: clamp(40px, 5.5vw, 88px);
    font-weight: 500;
    letter-spacing: -0.035em;
    line-height: 1;
    max-width: 920px;
    margin: 0 auto 36px;
  }
  .contact-cta { display: inline-flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .contact-side {
    margin-top: 44px;
    display: flex; gap: 24px;
    justify-content: center;
    color: var(--ink-55);
    font-size: 13.5px;
    flex-wrap: wrap;
  }
  .contact-side a { color: var(--ink-70); text-decoration: none; border-bottom: 1px solid var(--line-2); padding-bottom: 1px; }
  .contact-side a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* Chat widget — second cerveau */
  .chat-fab {
    position: fixed; right: 22px; bottom: 22px; z-index: 90;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 16px; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--paper);
    font: 600 13px/1 Inter, sans-serif; letter-spacing: 0.01em;
    cursor: pointer; box-shadow: 0 8px 24px rgba(11,20,38,0.25), 0 2px 6px rgba(11,20,38,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .chat-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(11,20,38,0.32), 0 4px 10px rgba(11,20,38,0.18); }
  .chat-fab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: chat-pulse 2s infinite; }
  @keyframes chat-pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,53,0.5); } 70% { box-shadow: 0 0 0 8px rgba(255,107,53,0); } 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0); } }

  .chat-panel {
    position: fixed; right: 22px; bottom: 78px; z-index: 91;
    width: min(380px, calc(100vw - 32px)); height: min(560px, calc(100vh - 120px));
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 24px 64px rgba(11,20,38,0.22), 0 4px 12px rgba(11,20,38,0.08);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; transform: translateY(12px) scale(0.98); pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .chat-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--ink); color: var(--paper); }
  .chat-head-title { display: flex; align-items: center; gap: 10px; }
  .chat-head-title strong { font: 600 13.5px/1.2 Inter, sans-serif; }
  .chat-head-title small { font: 400 11px/1.2 Inter, sans-serif; opacity: 0.65; }
  .chat-head-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px/1 Inter, sans-serif; color: var(--ink); }
  .chat-close { background: transparent; border: 0; color: var(--paper); opacity: 0.65; cursor: pointer; padding: 4px; border-radius: 6px; }
  .chat-close:hover { opacity: 1; background: rgba(255,255,255,0.08); }
  .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fbfaf6; }
  .chat-msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font: 400 13.5px/1.45 Inter, sans-serif; word-wrap: break-word; }
  .chat-msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; white-space: pre-wrap; }

    renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.position = "absolute";
    renderer.domElement.style.inset = "0";
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    renderer.domElement.style.cursor = "grab";
    container.appendChild(renderer.domElement);

    const inMain = (x, y, z) => {
      const ax = x < 0 ? 1.20 : 1.35;
      const ay = y < 0 ? 0.60 : 0.78;
      const az = 0.65;
      return (x / ax) ** 2 + (y / ay) ** 2 + (z / az) ** 2 <= 1;
    };
    const inCerebellum = (x, y, z) =>
      ((x - 0.78) / 0.48) ** 2 + ((y + 0.55) / 0.35) ** 2 + (z / 0.45) ** 2 <= 1;
    const inNotch = (x, y, z) =>
      ((x - 0.55) / 0.16) ** 2 + ((y + 0.10) / 0.12) ** 2 + (z / 0.30) ** 2 <= 1;
    const inBrain = (x, y, z) =>
      (inMain(x, y, z) || inCerebellum(x, y, z)) && !inNotch(x, y, z);

    const SURFACE_TARGET = 160;
    const VOLUME_TARGET = 60;
    const bgPositions = [];
    let attempts = 0;
    while (bgPositions.length < SURFACE_TARGET && attempts < 80000) {
      attempts++;
      const x = (Math.random() * 2 - 1) * 1.45;
      const y = (Math.random() * 2 - 1) * 0.95;
      const z = (Math.random() * 2 - 1) * 0.78;
      const ax = x < 0 ? 1.20 : 1.35;
      const ay = y < 0 ? 0.60 : 0.78;
      const az = 0.65;
      const m = (x / ax) ** 2 + (y / ay) ** 2 + (z / az) ** 2;
      const c = ((x - 0.78) / 0.48) ** 2 + ((y + 0.55) / 0.35) ** 2 + (z / 0.45) ** 2;
      const notch = ((x - 0.55) / 0.16) ** 2 + ((y + 0.10) / 0.12) ** 2 + (z / 0.30) ** 2;
      if (notch <= 1) continue;
      const nearMain = Math.abs(m - 1) < 0.07;
      const nearCereb = Math.abs(c - 1) < 0.10;
      if ((nearMain && c > 1) || (nearCereb && m > 1)) bgPositions.push([x, y, z]);
    }
    attempts = 0;
    while (bgPositions.length < SURFACE_TARGET + VOLUME_TARGET && attempts < 60000) {
      attempts++;
      const x = (Math.random() * 2 - 1) * 1.2;
      const y = (Math.random() * 2 - 1) * 0.7;
      const z = (Math.random() * 2 - 1) * 0.55;
      if (inBrain(x, y, z)) bgPositions.push([x, y, z]);
    }

    const namedList = Object.entries(ANCHORS).map(([id, pos]) => ({ id, pos, named: true }));
    const allNodes = [
      ...namedList,
      ...bgPositions.map((p, i) => ({ id: "bg-" + i, pos: p, named: false })),
    ];

    const K = 3;
    const sqd = (a, b) => {
      const dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2];
      return dx * dx + dy * dy + dz * dz;
    };
    const edgeKeys = new Set();
    const edges = [];
    allNodes.forEach((a, i) => {
      const dists = [];
      for (let j = 0; j < allNodes.length; j++) {
        if (j === i) continue;
        dists.push({ j, d: sqd(a.pos, allNodes[j].pos) });
      }
      dists.sort((x, y) => x.d - y.d);
      const k = a.named ? 5 : K;
      for (let q = 0; q < k && q < dists.length; q++) {
        const j = dists[q].j;
        const key = i < j ? i + "-" + j : j + "-" + i;
        if (!edgeKeys.has(key)) { edgeKeys.add(key); edges.push([i, j]); }
      }
    });

    const root = new THREE.Group();
    scene.add(root);

    const linePositions = new Float32Array(edges.length * 6);
    edges.forEach(([i, j], k) => {
      const a = allNodes[i].pos, b = allNodes[j].pos;
      linePositions[k * 6] = a[0]; linePositions[k * 6 + 1] = a[1]; linePositions[k * 6 + 2] = a[2];
      linePositions[k * 6 + 3] = b[0]; linePositions[k * 6 + 4] = b[1]; linePositions[k * 6 + 5] = b[2];
    });
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    const lineMat = new THREE.LineBasicMaterial({ color: 0x0B1426, transparent: true, opacity: 0.16, depthWrite: false });
    root.add(new THREE.LineSegments(lineGeo, lineMat));

    const bgArr = new Float32Array(bgPositions.length * 3);
    bgPositions.forEach((p, i) => { bgArr[i*3]=p[0]; bgArr[i*3+1]=p[1]; bgArr[i*3+2]=p[2]; });
    const bgGeo = new THREE.BufferGeometry();
    bgGeo.setAttribute("position", new THREE.BufferAttribute(bgArr, 3));
    const bgMat = new THREE.PointsMaterial({ color: 0x0B1426, size: 0.028, transparent: true, opacity: 0.55, depthWrite: false, sizeAttenuation: true });
    root.add(new THREE.Points(bgGeo, bgMat));

    const namedMeshes = [];
    const conceptHalos = [];
    const sphereGeoC = new THREE.SphereGeometry(0.075, 28, 28);
    const sphereGeoH = new THREE.SphereGeometry(0.058, 22, 22);
    const sphereGeoL = new THREE.SphereGeometry(0.044, 18, 18);
    const sphereGeoConcept = new THREE.SphereGeometry(0.050, 20, 20);
    const sphereGeoConceptHalo = new THREE.SphereGeometry(0.065, 20, 20);

    namedList.forEach((n) => {
      const node = data.nodes.find((x) => x.id === n.id);
      const kind = node?.kind || "leaf";
      if (kind === "concept") {
        const haloMat = new THREE.MeshBasicMaterial({ color: 0x0066FF, transparent: true, opacity: 0.18, side: THREE.BackSide });
        const haloMesh = new THREE.Mesh(sphereGeoConceptHalo, haloMat);
        haloMesh.position.set(n.pos[0], n.pos[1], n.pos[2]);
        root.add(haloMesh);
        conceptHalos.push({ id: n.id, mesh: haloMesh });

        const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.96 });
        const m = new THREE.Mesh(sphereGeoConcept, mat);
        m.position.set(n.pos[0], n.pos[1], n.pos[2]);
        m.userData = { id: n.id, kind, node, baseScale: 1 };
        root.add(m);
        namedMeshes.push(m);
      } else {
        const geo = kind === "center" ? sphereGeoC : (kind === "hub" || kind === "branch") ? sphereGeoH : sphereGeoL;
        const mat = new THREE.MeshBasicMaterial({ color: 0x0B1426, transparent: true, opacity: 0.96 });
        const m = new THREE.Mesh(geo, mat);
        m.position.set(n.pos[0], n.pos[1], n.pos[2]);
        m.userData = { id: n.id, kind, node, baseScale: 1 };
        root.add(m);
        namedMeshes.push(m);
      }
    });

    const labelEls = {};
    namedList.forEach((n) => {
      const node = data.nodes.find((x) => x.id === n.id);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "brain-label brain-label-" + (node?.kind || "leaf");
      el.dataset.nodeId = n.id;
      el.textContent = node?.label || n.id;
      el.addEventListener("mouseenter", () => setHoverId(n.id));
      el.addEventListener("mouseleave", () => setHoverId(null));
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        if (onNodeClickRef.current && node) onNodeClickRef.current(node);
      });
      container.appendChild(el);
      labelEls[n.id] = el;
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let dragging = false, dragX = 0, dragY = 0, suppressClick = false;
    let userRotY = 0.35, userRotX = -0.05, autoRotY = 0, lastInteract = -Infinity;

    const setHoverFromPointer = (cx, cy) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(namedMeshes, false);
      if (hits.length > 0) {
        setHoverId(hits[0].object.userData.id);
        renderer.domElement.style.cursor = "pointer";
        return hits[0].object.userData.id;
      }
      setHoverId(null);
      renderer.domElement.style.cursor = dragging ? "grabbing" : "grab";
      return null;
    };

    const onPD = (e) => { dragging = true; dragX = e.clientX; dragY = e.clientY; suppressClick = false; lastInteract = performance.now(); renderer.domElement.style.cursor = "grabbing"; try { renderer.domElement.setPointerCapture(e.pointerId); } catch(_){} };
    const onPM = (e) => {
      if (dragging) {
        const dx = e.clientX - dragX, dy = e.clientY - dragY;
        if (Math.abs(dx)+Math.abs(dy)>3) suppressClick = true;
        userRotY += dx*0.005; userRotX += dy*0.004;
        userRotX = Math.max(-0.55, Math.min(0.55, userRotX));
        dragX = e.clientX; dragY = e.clientY; lastInteract = performance.now();
      } else { setHoverFromPointer(e.clientX, e.clientY); }
    };
    const onPU = (e) => { if (!dragging) return; dragging = false; lastInteract = performance.now(); renderer.domElement.style.cursor = "grab"; try { renderer.domElement.releasePointerCapture(e.pointerId); } catch(_){} };
    const onCl = (e) => { if (suppressClick) { suppressClick = false; return; } const id = setHoverFromPointer(e.clientX, e.clientY); if (id) { const node = data.nodes.find((x)=>x.id===id); if (node && onNodeClickRef.current) onNodeClickRef.current(node); } };

    renderer.domElement.addEventListener("pointerdown", onPD);
    renderer.domElement.addEventListener("pointermove", onPM);
    renderer.domElement.addEventListener("pointerup", onPU);
    renderer.domElement.addEventListener("pointercancel", onPU);
    renderer.domElement.addEventListener("pointerleave", () => { if (!dragging) setHoverId(null); });
    renderer.domElement.addEventListener("click", onCl);

    const onResize = () => {
      width = Math.max(320, container.clientWidth);
      height = Math.max(380, container.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(onResize);
    ro.observe(container);

    const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    const tmpVec = new THREE.Vector3();
    const tmpScale = new THREE.Vector3();
    let raf = 0;
    const animate = () => {
      const now = performance.now();
      const idleMs = now - lastInteract;
      const auto = (!dragging && idleMs > 400 && !reduceMotion) ? 0.0010 : 0.0;
      autoRotY += auto;
      root.rotation.y = userRotY + autoRotY;
      root.rotation.x = userRotX;

      const aSet = activeRef.current;
      const hId = hoverRef.current;
      for (let i = 0; i < namedMeshes.length; i++) {
        const m = namedMeshes[i];
        m.getWorldPosition(tmpVec);
        const worldZ = tmpVec.z;
        const ndc = tmpVec.clone().project(camera);
        const sx = (ndc.x*0.5+0.5)*width;
        const sy = (-ndc.y*0.5+0.5)*height;
        const depthAlpha = Math.max(0, Math.min(1, (worldZ+0.2)/0.9));
        const isActive = aSet.has(m.userData.id);
        const isHover = hId === m.userData.id;
        const isConcept = m.userData.kind === "concept";
        const el = labelEls[m.userData.id];
        if (el) {
          el.style.transform = "translate(-50%, calc(-100% - 16px))";
          el.style.left = sx + "px";
          el.style.top = sy + "px";
          el.style.opacity = String(isConcept ? 0.35 + depthAlpha * 0.65 : 0.22 + depthAlpha * 0.78);
          el.style.pointerEvents = depthAlpha > 0.30 ? "auto" : "none";
          el.classList.toggle("is-active", isActive);
          el.classList.toggle("is-hover", isHover);
          el.classList.toggle("is-back", depthAlpha < 0.35);
        }
        const targetHex = isConcept
          ? (isHover ? 0x0066FF : 0xFFFFFF)
          : ((isActive || isHover) ? 0x0066FF : 0x0B1426);
        m.material.color.setHex(targetHex);
        m.material.opacity = 0.45 + depthAlpha * 0.55;
        const target = isHover ? 1.45 : isActive ? 1.25 : 1.0;
        tmpScale.set(target, target, target);
        m.scale.lerp(tmpScale, 0.18);
      }
      conceptHalos.forEach(({ id, mesh }) => {
        const isHov = hoverRef.current === id;
        mesh.material.opacity = isHov ? 0.38 + 0.18 * Math.sin(now * 0.004) : 0.18;
      });
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    raf = requestAnimationFrame(animate);

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.domElement.removeEventListener("pointerdown", onPD);
      renderer.domElement.removeEventListener("pointermove", onPM);
      renderer.domElement.removeEventListener("pointerup", onPU);
      renderer.domElement.removeEventListener("pointercancel", onPU);
      renderer.domElement.removeEventListener("click", onCl);
      Object.values(labelEls).forEach((el) => el.remove());
      renderer.dispose();
      lineGeo.dispose(); bgGeo.dispose();
      sphereGeoC.dispose(); sphereGeoH.dispose(); sphereGeoL.dispose();
      sphereGeoConcept.dispose(); sphereGeoConceptHalo.dispose();
      conceptHalos.forEach(({ mesh }) => { mesh.material.dispose(); });
      lineMat.dispose(); bgMat.dispose();
      namedMeshes.forEach((m) => m.material.dispose());
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      sceneRef.current = null;
    };
  }, []);

  return <div ref={containerRef} className="graph-stage" aria-label="Cerveau 3D" />;
}

function useScrollingActive(idleMs = 600) {
  const [scrolling, setScrolling] = useState(false);
  useEffect(() => {
    let t = null;
    const onScroll = () => { setScrolling(true); if (t) clearTimeout(t); t = setTimeout(() => setScrolling(false), idleMs); };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => { window.removeEventListener("scroll", onScroll); if (t) clearTimeout(t); };
  }, [idleMs]);
  return scrolling;
}

function Minimap({ activeSection, onNodeClick }) {
  const data = window.PORTFOLIO;
  const w = 206, h = 190;
  const scrolling = useScrollingActive(650);
  const [hover, setHover] = useState(false);
  const [atTop, setAtTop] = useState(true);
  const [hoveredNode, setHoveredNode] = useState(null);
  const asideRef = useRef(null);

  useEffect(() => {
    const onScroll = () => setAtTop(window.scrollY < 200);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const collapsed = scrolling && !hover;
  const visible = !atTop && activeSection !== "hero";
  const cx = w / 2, cy = h / 2;
  const radius = Math.min(w, h) * 0.37;

  const positions = useMemo(() => {
    const peers = data.nodes.filter(n => !n.fixed && n.kind !== "concept");
    const pos = {};
    pos["moi"] = { x: cx, y: cy };
    peers.forEach((n, k) => {
      const a = (k / peers.length) * Math.PI * 2 - Math.PI / 2;
      pos[n.id] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius };
    });
    return pos;
  }, []);

  const activeSet = new Set(data.sectionNodes[activeSection] || ["moi"]);
  const sectionLabel =
    activeSection === "hero"        ? "00 / overview" :
    activeSection === "parcours"    ? "01 / parcours" :
    activeSection === "side-hustle" ? "02 / side hustle" :
    activeSection === "approche"    ? "03 / approche" :
    activeSection === "contact"     ? "04 / contact" : "";

  // Compute label anchor offset to push label away from center
  const getLabelAnchor = (p) => {
    const dx = p.x - cx, dy = p.y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const ox = (dx / dist) * 12, oy = (dy / dist) * 12;
    const anchor = dx > 2 ? "start" : dx < -2 ? "end" : "middle";
    return { x: p.x + ox, y: p.y + oy + (dy > 0 ? 3 : -3), anchor };
  };

  // Tooltip vertical position — clamp so it doesn't go off the card
  const tooltipTop = useMemo(() => {
    if (!hoveredNode) return 30;
    const p = positions[hoveredNode.id];
    const pct = p.y / h;
    return Math.max(10, Math.min(130, Math.round(pct * 190) - 20));
  }, [hoveredNode]);

  return (
    <aside ref={asideRef}
      className={"minimap" + (visible ? " visible" : "") + (collapsed ? " collapsed" : "")}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => { setHover(false); setHoveredNode(null); }}>
      <div className="minimap-head">
        <span className="minimap-title">Carte</span>
        <span className="minimap-current">{sectionLabel}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`}>
        {data.edges.map(([a, b], i) => {
          const A = positions[a], B = positions[b];
          if (!A || !B) return null;
          const hot = activeSet.has(a) && activeSet.has(b);
          const dimmed = hoveredNode && hoveredNode.id !== a && hoveredNode.id !== b;
          return <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y}
            className={"mini-edge" + (hot ? " hot" : "")}
            style={{ opacity: dimmed ? 0.3 : 1, transition: "opacity 0.15s" }} />;
        })}
        {data.nodes.filter(n => n.kind !== "concept").map((n) => {
          const p = positions[n.id];
          const isCenter = n.id === "moi";
          const isActive = activeSet.has(n.id) && !isCenter;
          const isHov = hoveredNode && hoveredNode.id === n.id;
          const showLabel = isActive || isHov;
          const la = getLabelAnchor(p);
          const baseR = isCenter ? 5 : (isActive ? 4.5 : 3.5);
          const r = isHov ? baseR + 1.5 : baseR;
          return (
            <g key={n.id}>
              <circle cx={p.x} cy={p.y} r={r}
                className={"mini-node" + (isCenter ? " center" : "") + (isActive ? " active" : "") + (isHov ? " hovered" : "")}
                style={{ cursor: "pointer", transition: "r 0.15s ease" }} />
              {showLabel && !isCenter && (
                <text x={la.x} y={la.y} textAnchor={la.anchor}
                  className={"mini-label" + (isActive ? " active" : "")}>
                  {n.label.length > 12 ? n.label.slice(0, 11) + "…" : n.label}
                </text>
              )}
              {/* Invisible large hit area */}
              <circle cx={p.x} cy={p.y} r={12}
                className="mini-node-hit"
                onMouseEnter={() => setHoveredNode(n)}
                onMouseLeave={() => setHoveredNode(null)}
                onClick={() => onNodeClick && onNodeClick(n)} />
            </g>
          );
        })}
      </svg>
      {/* Tooltip card */}
      {hoveredNode && (
        <div className={"minimap-tooltip show"} style={{ top: tooltipTop + "px" }}>
          <div className="minimap-tooltip-label">
            <span className="tt-dot" />
            {hoveredNode.label}
          </div>
          {hoveredNode.desc && (
            <div className="minimap-tooltip-desc">{hoveredNode.desc}</div>
          )}
          <div className="minimap-tooltip-cta">
            {hoveredNode.id === "moi" ? "centre du graphe" : "cliquer pour explorer →"}
          </div>
        </div>
      )}
    </aside>
  );
}

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
      { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }
    );
    el.querySelectorAll(".reveal, .reveal-stagger").forEach((n) => io.observe(n));
    return () => io.disconnect();
  }, []);
  return ref;
}

function ApprocheSection() {
  const ref = useReveal();
  const a = window.PORTFOLIO.approche;
  return (
    <section id="approche" className="sec" ref={ref}>

function useActiveSection(ids) {
  const [active, setActive] = useState(ids[0]);
  useEffect(() => {
    const obs = new IntersectionObserver(
      (entries) => {
        const visible = entries.filter((e) => e.isIntersecting);
        if (visible.length === 0) return;
        visible.sort((a, b) => Math.abs(a.boundingClientRect.top) - Math.abs(b.boundingClientRect.top));
        setActive(visible[0].target.id);
      },
      { rootMargin: "-30% 0px -55% 0px", threshold: [0, 0.1, 0.5] }
    );
    ids.forEach((id) => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, [ids.join(",")]);
  return active;
}

function useScrolled() {

}

function CommandPalette({ open, onClose, items }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { if (open) { setQ(""); setSel(0); setTimeout(() => inputRef.current?.focus(), 30); } }, [open]);
  const filtered = useMemo(() => {
    if (!q.trim()) return items;
    const Q = q.toLowerCase();
    return items.filter((it) => it.label.toLowerCase().includes(Q) || (it.hint || "").toLowerCase().includes(Q));
  }, [q, items]);
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel((s) => Math.min(filtered.length - 1, s + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel((s) => Math.max(0, s - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); const it = filtered[sel]; if (it) { it.action(); onClose(); } }
    else if (e.key === "Escape") onClose();
  };
  return (
    <div className={"palette-backdrop" + (open ? " open" : "")} onClick={onClose} role="dialog" aria-modal="true">
      <div className="palette" onClick={(e) => e.stopPropagation()}>
        <input ref={inputRef} value={q} onChange={(e) => { setQ(e.target.value); setSel(0); }} onKeyDown={onKey}
          placeholder="Aller à une section, un projet, un contact…" />
        <div className="palette-list">
          {filtered.length === 0 && <div className="palette-item" style={{ color: "var(--ink-35)" }}>Aucun r&eacute;sultat</div>}
          {filtered.map((it, i) => (
            <div key={it.id} className={"palette-item" + (i === sel ? " sel" : "")}
              onMouseEnter={() => setSel(i)} onClick={() => { it.action(); onClose(); }}>
              <span>{it.label}</span>
              {it.hint && <span className="mono">{it.hint}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ChatWidget() {
  const [open, setOpen] = useState(false);
  const [chipsVisible, setChipsVisible] = useState(true);
  const CHIPS = [
    "Pourquoi te recruter ?",
    "Raconte-moi ton parcours",
    "Quelle est ton expérience commerciale ?",
  ];
  const [messages, setMessages] = useState([
    { role: "assistant", content: "Salut 👋 Je suis le second cerveau de Benoît. Pose-moi une question sur son parcours, sa stack, ses convictions — ou demande-moi pourquoi tu devrais le recruter." },
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const bodyRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [messages, loading]);

  useEffect(() => {
    if (open) setTimeout(() => inputRef.current?.focus(), 80);
  }, [open]);

  const sendText = async (text) => {
    setChipsVisible(false);
    if (!text || loading) return;
    setError(null);
    const next = [...messages, { role: "user", content: text }];
    setMessages(next);
    setInput("");
    setLoading(true);
    setMessages((m) => [...m, { role: "assistant", content: "" }]);
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: next }),
      });
      if (!r.ok) {
        const data = await r.json();
        throw new Error(data?.error || "Erreur " + r.status);
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      streaming: while (true) {
        const { done, value } = await reader.read();
        if (done) break streaming;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (raw === "[DONE]") break streaming;
          try {
            const { delta } = JSON.parse(raw);
            if (delta) {
              setMessages((m) => {
                const copy = [...m];
                copy[copy.length - 1] = {
                  ...copy[copy.length - 1],
                  content: copy[copy.length - 1].content + delta,
                };
                return copy;
              });
            }
          } catch { /* skip */ }
        }
      }
    } catch (e) {
      setMessages((m) => m.slice(0, -1));
      setError(e.message || "Erreur réseau");
    } finally {
      setLoading(false);
    }
  };

  const send = () => sendText(input.trim());

  const onKey = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };

  return (
    <React.Fragment>
      <button className="chat-fab" onClick={() => setOpen((o) => !o)} aria-label="Ouvrir le chat avec le second cerveau de Beno&icirc;t">
        <span className="dot"></span>
        {open ? "Fermer" : "Discuter avec mon IA"}
      </button>
      <div className={"chat-panel" + (open ? " open" : "")} role="dialog" aria-label="Chat second cerveau">
        <div className="chat-head">
          <div className="chat-head-title">
            <span className="chat-head-avatar">B</span>
            <div>
              <strong>Second cerveau de Beno&icirc;t</strong><br/>
              <small>propuls&eacute; par DeepSeek &middot; r&eacute;ponses ~ Beno&icirc;t</small>
            </div>
          </div>
          <button className="chat-close" onClick={() => setOpen(false)} aria-label="Fermer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div className="chat-body" ref={bodyRef}>
          {messages.map((m, i) =>
            m.role === "user" ? (
              <div key={i} className="chat-msg user">{m.content}</div>
            ) : (
              <div
                key={i}
                className="chat-msg bot"
                dangerouslySetInnerHTML={{
                  __html: DOMPurify.sanitize(marked.parse(m.content || ""))
                }}
              />
            )
          )}
          {chipsVisible && (
            <div className="chat-chips">
              {CHIPS.map((chip) => (
                <button
                  key={chip}
                  className="chat-chip"
                  disabled={loading}
                  onClick={() => sendText(chip)}
                >
                  {chip}
                </button>
              ))}
            </div>
          )}
          {loading && messages[messages.length - 1]?.content === "" && (
            <div className="chat-typing"><span></span><span></span><span></span></div>
          )}
          {error && <div className="chat-msg err">{error}</div>}
        </div>
        <div className="chat-foot">
          <input ref={inputRef} value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={onKey}
            placeholder="Pose ta question..." disabled={loading} />
          <button onClick={send} disabled={loading || !input.trim()}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div className="chat-legend">IA &middot; peut se tromper &middot; rate-limit 20 msg/h</div>
      </div>
    </React.Fragment>
  );
}

function App() {
  const data = window.PORTFOLIO;
  const sectionIds = ["hero", "parcours", "contact"];
  const active = useActiveSection(sectionIds);
  const scrolled = useScrolled();
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [openConcept, setOpenConcept] = useState(null);

  const scrollTo = useCallback((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - (id === "hero" ? 0 : 24);
    window.scrollTo({ top, behavior: "smooth" });
  }, []);

  const onNodeClick = useCallback((node) => {
    if (!node) return;
    if (node.concept) { setOpenConcept(node.concept); return; }
    if (node.section) scrollTo(node.section);
  }, [scrollTo]);

  const onOpenSideHustle = useCallback(() => {
    const node = window.PORTFOLIO.nodes.find(n => n.id === "side-hustle");
    if (node?.concept) setOpenConcept(node.concept);
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        setPaletteOpen((o) => !o);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  useEffect(() => {
    const name = window.PORTFOLIO.identity.name;
    const styleHead = "background:#0B1426;color:#FAFAF8;font:600 13px/1.4 Inter,sans-serif;padding:6px 12px;border-radius:4px 4px 0 0;";
    const styleBody = "background:#FAFAF8;color:#0B1426;font:400 12px/1.5 Inter,sans-serif;padding:10px 12px;border-radius:0 0 4px 4px;border:1px solid #e6e3da;border-top:0;";
    console.log("%cHey, curieux 👋%c\n" +
      "Tu lis la console. Bon réflexe.\n" +
      "→ " + name + " — Paris\n" +
      "→ " + window.PORTFOLIO.contact.email + "\n\n" +
      "Stack du site : Next.js 14 · TypeScript strict · Tailwind · Framer Motion.\n" +
      "Code sans abstraction inutile. Tape `__portfolio` pour fouiller la data.",
      styleHead, styleBody);
    window.__portfolio = window.PORTFOLIO;
  }, []);

  const paletteItems = useMemo(() => {
    const out = [];
    sectionIds.forEach((id) => {
      out.push({ id: "sec-" + id, label: "Aller à " + id.charAt(0).toUpperCase() + id.slice(1), hint: id, action: () => scrollTo(id) });
    });
    const shNode = data.nodes.find(n => n.id === "side-hustle");
    data.sideHustle.forEach((p) => {
      out.push({ id: "proj-" + p.n, label: "Projet : " + p.name, hint: p.tag.split(" / ")[0], action: () => { if (shNode?.concept) setOpenConcept(shNode.concept); } });
    });
    out.push({ id: "email", label: "Envoyer un email", hint: data.contact.email, action: () => window.location.href = "mailto:" + data.contact.email });
    out.push({ id: "linkedin", label: "Ouvrir LinkedIn", hint: data.contact.linkedin, action: () => window.open("https://" + data.contact.linkedin, "_blank") });
    return out;
  }, []);

  return (
    <React.Fragment>
      <Topbar scrolled={scrolled} onOpenPalette={() => setPaletteOpen(true)} onOpenSideHustle={onOpenSideHustle} />
      <main>
        <Hero onNodeClick={onNodeClick} />
        <ParcoursSection />
        <GallerySection />
        <ContactSection />
        <ClaudeContextSection />
        <footer>
          <div className="container footer-row">
            <span className="mono">&copy; 2026 &mdash; {data.identity.name}</span>
            <span className="mono">build_ref: portfolio.v1 &middot; paris</span>
          </div>
        </footer>
      </main>
      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} items={paletteItems} />
      <ChatWidget />
      {openConcept && <ConceptPopup concept={openConcept} onClose={() => setOpenConcept(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

</body>
</html>
